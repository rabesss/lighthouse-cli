[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-cli"
version = "0.1.0"
description = "CLI tool for D2L Brightspace LMS at lighthouse.manipal.edu"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "cryptography>=41.0,<100",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
credentials = ["keyring>=24.0", "cryptography>=41.0,<100"]
auth = ["playwright>=1.40"]
cdp = ["websockets>=12,<16"]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.14",
    "types-requests>=2.31",
    "import-linter>=2.0",
    "deptry>=0.20",
    "xenon>=0.9",
    "radon>=6.0",
    "detect-secrets>=1.5",
    "pre-commit>=3.6",
]

[project.scripts]
lighthouse = "lighthouse_cli.cli:cli"

[tool.setuptools.packages.find]
include = ["lighthouse_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lighthouse_cli"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",   # long URLs/IDs inside literals; whitespace handled by `ruff format`
    "RUF001", # typographic arrows/quotes in user-facing docstrings are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lighthouse_cli"]

[[tool.mypy.overrides]]
module = ["bs4.*", "keyring.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["lighthouse_cli"]

[[tool.importlinter.contracts]]
# Layers were derived from the actual import graph (see scripts/check_import_layers
# regeneration notes in CONTRIBUTING). Every module sits in the lowest layer that is
# above all of its internal dependencies; `|` separates sibling modules that never
# import each other. Breaking a layer (e.g. foundation importing the API client)
# fails CI.
name = "CLI layered architecture (entry point > command groups > workflows > api > foundation)"
type = "layers"
layers = [
    "lighthouse_cli.cli",
    "lighthouse_cli.assessment_commands",
    "lighthouse_cli.quiz_preview_commands",
    "lighthouse_cli.commands | lighthouse_cli.quiz_preview_session",
    "lighthouse_cli.course_read_commands | lighthouse_cli.quiz_preview_finish | lighthouse_cli.show | lighthouse_cli.sync_engine",
    "lighthouse_cli.assessment_api | lighthouse_cli.assignments | lighthouse_cli.auth | lighthouse_cli.course_config | lighthouse_cli.quiz_preview_transport | lighthouse_cli.submit",
    "lighthouse_cli.api | lighthouse_cli.ms_auth | lighthouse_cli.session_import",
    "lighthouse_cli.config",
    "lighthouse_cli.credential_store | lighthouse_cli.manifest | lighthouse_cli.ms_mfa | lighthouse_cli.quiz_attempt_page",
    "lighthouse_cli.connection | lighthouse_cli.display | lighthouse_cli.ms_errors | lighthouse_cli.ms_parse | lighthouse_cli.ms_session | lighthouse_cli.quiz_rules | lighthouse_cli.request_protection | lighthouse_cli.utils",
]

[[tool.importlinter.contracts]]
name = "Foundation helpers never import upper layers"
type = "forbidden"
source_modules = [
    "lighthouse_cli.display",
    "lighthouse_cli.manifest",
    "lighthouse_cli.connection",
    "lighthouse_cli.request_protection",
    "lighthouse_cli.config",
    "lighthouse_cli.credential_store",
    "lighthouse_cli.utils",
]
forbidden_modules = [
    "lighthouse_cli.api",
    "lighthouse_cli.assessment_api",
    "lighthouse_cli.commands",
    "lighthouse_cli.assessment_commands",
    "lighthouse_cli.course_read_commands",
    "lighthouse_cli.quiz_preview_commands",
    "lighthouse_cli.auth",
    "lighthouse_cli.cli",
]

[tool.deptry]
# python_version is derived from requires-python; scan the shipped package only.
exclude = ["tests", ".venv", "docs", "scripts"]

[tool.deptry.per_rule_ignores]
# Dev/test/CI tooling: declared for contributors and CI, never imported at runtime.
DEP002 = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "import-linter",
    "deptry",
    "xenon",
    "radon",
    "detect-secrets",
    "pre-commit",
]

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true
