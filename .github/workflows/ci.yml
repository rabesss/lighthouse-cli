name: CI

# Kept to three short jobs: GitHub bills every job rounded up to a whole
# minute, so splitting cheap checks into more jobs multiplies the cost.
on:
  push:
    branches: [main]
    # Nothing in the suite reads these; a change that also touches code still runs.
    paths-ignore: ["docs/**", "droid-wiki/**", "README.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "droid-wiki/**", "README.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / types / architecture / deps / secrets
    # Draft PRs wait for ready_for_review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks scan
      - name: Git history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # pragma: allowlist secret
          # Pinned so the rule-scoped allowlist in .gitleaks.toml keeps the
          # semantics it was verified against.
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned dev toolchain
        run: pip install -r requirements-dev.txt
      - name: Working tree secret scan (audited baseline)
        # Rejects any finding in git-tracked files that is not in the audited
        # baseline and never writes the baseline (scripts/check_secrets.py).
        run: python scripts/check_secrets.py
      - name: Lint
        run: ruff check .
      - name: Type check (strict)
        run: mypy
      - name: Architecture layers
        run: lint-imports
      - name: Unused / undeclared dependency scan
        run: deptry .
      - name: Complexity ratchet
        # Gates the average (-a B) and per-module (-m C) complexity only.
        # `-b F` is the loosest block rank, so it does NOT stop a new
        # worst-case (rank F) block from landing; review catches those.
        # ms_auth.py (SSO state machine) is excluded as a known hotspot.
        run: xenon -a B -m C -b F -e "*/ms_auth.py" lighthouse_cli

  tests:
    name: tests (py${{ matrix.python-version }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lockfile is compiled for 3.10 but every pin also resolves on
          # 3.13; both legs install it so 3.13 never floats to new versions.
          # Coverage is measured on one leg only.
          - python-version: "3.10"
            pytest-args: --cov --cov-report=term
          - python-version: "3.13"
            pytest-args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      # The full suite includes the repository policy and secret-gate tests.
      - name: Test suite
        run: pytest -q --durations=10 ${{ matrix.pytest-args }}
