name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / types / architecture / deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned dev toolchain
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check (strict)
        run: mypy
      - name: Architecture layers
        run: lint-imports
      - name: Unused / undeclared dependency scan
        run: deptry .
      - name: Complexity ratchet
        # Gates the average (-a B) and per-module (-m C) complexity only.
        # `-b F` is the loosest block rank, so it does NOT stop a new
        # worst-case (rank F) block from landing; review catches those.
        # ms_auth.py (SSO state machine) is excluded as a known hotspot.
        run: xenon -a B -m C -b F -e "*/ms_auth.py" lighthouse_cli

  security:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Git history secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # pragma: allowlist secret
          # Pinned so the rule-scoped allowlist in .gitleaks.toml keeps the
          # semantics it was verified against.
          GITLEAKS_VERSION: "8.30.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Working tree secret scan (audited baseline)
        # Rejects any finding in git-tracked files that is not in the audited
        # baseline and never writes the baseline (scripts/check_secrets.py).
        # The pragma marks "detect-secrets==1.5.0" as a version pin, not a secret.
        run: | # pragma: allowlist secret
          pip install detect-secrets==1.5.0
          python scripts/check_secrets.py

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            install: pip install -r requirements-dev.txt && pip install -e . --no-deps
          # The lockfile is compiled for 3.10 but every pin also resolves on
          # 3.13; both legs install it so 3.13 never floats to new versions.
          - python-version: "3.13"
            install: pip install -r requirements-dev.txt && pip install -e . --no-deps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: ${{ matrix.install }}
      - name: Test suite
        run: pytest -q --durations=10 --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  policies:
    name: repository policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Same locked install as the test legs: conftest imports click and the
      # package, and the secret-gate regressions need detect-secrets.
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - run: pytest tests/test_repo_policies.py tests/test_secret_gate.py -q
