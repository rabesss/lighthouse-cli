name: PR 12 follow-up patch retry

on:
  push:
    branches:
      - arch/deepening-pass

permissions:
  contents: write

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/deepening-pass
          fetch-depth: 0

      - name: Verify reviewed starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "53d378c1071ca6954146787cc8dc889d1105dc28"
          test -f .github/pr12_followups.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Make AST replacements indentation-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/pr12_followups.py')
          text = p.read_text()
          old = '''    replacement = dedent(source).strip("\\n") + "\\n"
    lines = text.splitlines(keepends=True)
    write(path, "".join(lines[:start]) + replacement + "".join(lines[end:]))
'''
          if old not in text:
              old = '''    lines = text.splitlines(keepends=True)
    replacement = dedent(source).strip("\\n") + "\\n"
    write(path, "".join(lines[:start]) + replacement + "".join(lines[end:]))
'''
          new = '''    lines = text.splitlines(keepends=True)
    indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
    raw = dedent(source).strip("\\n") + "\\n"
    replacement = "".join(
        indent + line if line.strip() else line
        for line in raw.splitlines(keepends=True)
    )
    write(path, "".join(lines[:start]) + replacement + "".join(lines[end:]))
'''
          if old not in text:
              raise SystemExit('replace_def helper shape not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply follow-up patch
        run: python .github/pr12_followups.py

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q lighthouse_cli tests

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[auth,credentials,dev]'
          python -m pip check

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run ruff when available
        shell: bash
        run: |
          if python -c 'import ruff' 2>/dev/null; then
            python -m ruff check lighthouse_cli tests scripts
          else
            echo "ruff is not installed by the project extras; skipped"
          fi

      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/pr12_followups.py \
            .github/workflows/pr12-followups.yml \
            .github/workflows/pr12-followups-retry.yml
          git add -A
          git commit -m "fix(auth): harden MFA approval and SSO follow-ups"
          git push origin HEAD:arch/deepening-pass
