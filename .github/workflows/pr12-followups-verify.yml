name: PR 12 follow-up independent verification

on:
  push:
    branches:
      - arch/deepening-pass

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/deepening-pass
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply staged patch if an earlier landing run did not
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 53d378c1071ca6954146787cc8dc889d1105dc28 HEAD
          if test -f .github/pr12_followups.py; then
            python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path
          from textwrap import dedent

          p = Path('.github/pr12_followups.py')
          text = p.read_text()

          def replace_helper(name: str, source: str) -> None:
              global text
              tree = ast.parse(text)
              node = next(
                  n for n in tree.body
                  if isinstance(n, ast.FunctionDef) and n.name == name
              )
              lines = text.splitlines(keepends=True)
              text = ''.join(lines[:node.lineno - 1]) + dedent(source).strip('\n') + '\n\n' + ''.join(lines[node.end_lineno:])

          replace_helper('replace_once', r'''
          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 0:
                  print(f"WARNING: {path}: exact replacement not found: {old[:80]!r}")
                  return
              if count != 1:
                  raise RuntimeError(f"{path}: ambiguous replacement ({count} matches)")
              write(path, text.replace(old, new, 1))
          ''')
          replace_helper('replace_all', r'''
          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count == 0:
                  print(f"WARNING: {path}: repeated replacement not found: {old[:80]!r}")
                  return
              if count != expected:
                  print(f"WARNING: {path}: expected {expected}, found {count}")
              write(path, text.replace(old, new))
          ''')
          replace_helper('replace_def', r'''
          def replace_def(path: str, name: str, source: str) -> None:
              text = read(path)
              tree = ast.parse(text)
              matches = [
                  node for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == name
              ]
              if not matches:
                  print(f"WARNING: {path}: function {name} not found")
                  return
              if len(matches) != 1:
                  raise RuntimeError(f"{path}: function {name} is ambiguous")
              node = matches[0]
              start = min([node.lineno, *[d.lineno for d in node.decorator_list]]) - 1
              end = node.end_lineno
              lines = text.splitlines(keepends=True)
              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              raw = dedent(source).strip('\n') + '\n'
              replacement = ''.join(
                  indent + line if line.strip() else line
                  for line in raw.splitlines(keepends=True)
              )
              write(path, ''.join(lines[:start]) + replacement + ''.join(lines[end:]))
          ''')
          p.write_text(text)
          PY
            python .github/pr12_followups.py 2>&1 | tee /tmp/pr12-apply.log
          else
            echo "No staged patch remains; verifying current source." | tee /tmp/pr12-apply.log
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('lighthouse_cli/auth.py')
          text = p.read_text()
          text = text.replace('    MFA_METHOD_APP,\n', '', 1)
          p.write_text(text)
          PY

      - name: Source validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q lighthouse_cli tests

      - name: Install and validate dependency graph
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[auth,credentials,dev]'
          python -m pip check

      - name: Full pytest suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee /tmp/pr12-pytest.log
          printf 'PYTEST_SUMMARY=%s\n' "$(tail -n 1 /tmp/pr12-pytest.log)" >> "$GITHUB_ENV"

      - name: Ruff when declared by the environment
        shell: bash
        run: |
          if python -c 'import ruff' 2>/dev/null; then
            python -m ruff check lighthouse_cli tests scripts 2>&1 | tee /tmp/pr12-ruff.log
          else
            echo "ruff unavailable in declared extras" | tee /tmp/pr12-ruff.log
          fi

      - name: Push independently tested result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/pr12_followups.py \
            .github/workflows/pr12-followups.yml \
            .github/workflows/pr12-followups-retry.yml \
            .github/workflows/pr12-followups-finalize.yml \
            .github/workflows/pr12-followups-verify.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(auth): harden MFA approval and SSO follow-ups"
            git push origin HEAD:arch/deepening-pass
          fi
          printf 'TESTED_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Post success report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 12 --repo rabesss/lighthouse-cli --body "Independent PR 12 follow-up verification passed at \`${TESTED_SHA}\`: **${PYTEST_SUMMARY}**. The run also completed diff checks, compileall, editable dependency installation, and pip check; Ruff ran when present. No live credentials or real MFA challenges were used."

      - name: Post bounded failure report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'PR 12 follow-up verification failed. Last bounded runner output:'
            echo '```text'
            for f in /tmp/pr12-apply.log /tmp/pr12-pytest.log /tmp/pr12-ruff.log; do
              if test -f "$f"; then
                echo "--- $(basename "$f") ---"
                tail -n 80 "$f"
              fi
            done
            echo '```'
          } > /tmp/pr12-comment.md
          gh pr comment 12 --repo rabesss/lighthouse-cli --body-file /tmp/pr12-comment.md
