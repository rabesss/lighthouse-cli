name: PR12 follow-up patch and test

on:
  push:
    branches:
      - arch/deepening-pass
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'arch/deepening-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/deepening-pass
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Materialize and apply reviewed follow-ups
        shell: bash
        run: |
          wc -c .github/pr12-payload/part*
          sha256sum .github/pr12-payload/part*
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          parts = sorted(Path('.github/pr12-payload').glob('part*'))
          payload = ''.join(path.read_text() for path in parts)
          print('payload characters:', len(payload))
          compressed = base64.b64decode(payload, validate=True)
          Path('/tmp/pr12_followups.py').write_bytes(gzip.decompress(compressed))
          PY
          python .github/pr12-payload/fix_patcher.py
          python -m py_compile /tmp/pr12_followups.py
          python /tmp/pr12_followups.py
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[auth,credentials,dev]' ruff

      - name: Lint Python surface
        run: ruff check lighthouse_cli tests scripts

      - name: Run full test suite
        run: pytest -q

      - name: Commit tested follow-ups
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(auth): close PR12 follow-up review'
          git push origin HEAD:arch/deepening-pass
