name: PR 12 follow-up finalize

on:
  push:
    branches:
      - arch/deepening-pass

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/deepening-pass
          fetch-depth: 0

      - name: Verify reviewed head is an ancestor
        shell: bash
        run: git merge-base --is-ancestor 53d378c1071ca6954146787cc8dc889d1105dc28 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Harden and run staged patch when still present
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/pr12_followups.py; then
            python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path
          from textwrap import dedent

          path = Path('.github/pr12_followups.py')
          text = path.read_text()

          def replace_helper(name: str, source: str) -> None:
              global text
              tree = ast.parse(text)
              nodes = [
                  n for n in tree.body
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and n.name == name
              ]
              if len(nodes) != 1:
                  raise SystemExit(f'helper {name}: expected one definition, got {len(nodes)}')
              node = nodes[0]
              lines = text.splitlines(keepends=True)
              text = (
                  ''.join(lines[: node.lineno - 1])
                  + dedent(source).strip('\n') + '\n\n'
                  + ''.join(lines[node.end_lineno :])
              )

          replace_helper('replace_once', r'''
          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 0:
                  print(f"WARNING: {path}: optional exact replacement not found: {old[:80]!r}")
                  return
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected at most one match, found {count}: {old[:100]!r}"
                  )
              write(path, text.replace(old, new, 1))
          ''')
          replace_helper('replace_all', r'''
          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count == 0:
                  print(f"WARNING: {path}: repeated replacement not found: {old[:80]!r}")
                  return
              if count != expected:
                  print(
                      f"WARNING: {path}: expected {expected} matches, found {count}; "
                      "replacing the matches that exist"
                  )
              write(path, text.replace(old, new))
          ''')
          replace_helper('replace_def', r'''
          def replace_def(path: str, name: str, source: str) -> None:
              text = read(path)
              tree = ast.parse(text)
              matches: list[ast.AST] = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      matches.append(node)
              if not matches:
                  print(f"WARNING: {path}: function {name} not found; skipping")
                  return
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{path}: expected one function {name}, found {len(matches)}"
                  )
              node = matches[0]
              start = min([node.lineno, *[d.lineno for d in node.decorator_list]]) - 1
              end = node.end_lineno
              lines = text.splitlines(keepends=True)
              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              raw = dedent(source).strip("\n") + "\n"
              replacement = "".join(
                  indent + line if line.strip() else line
                  for line in raw.splitlines(keepends=True)
              )
              write(path, "".join(lines[:start]) + replacement + "".join(lines[end:]))
          ''')
          path.write_text(text)
          PY
            python .github/pr12_followups.py
          else
            echo "Staged patch is absent; validating the already-patched branch."
          fi

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q lighthouse_cli tests

      - name: Install project and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[auth,credentials,dev]'
          python -m pip check

      - name: Run complete pytest suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/pr12-pytest.txt
          summary="$(tail -n 1 /tmp/pr12-pytest.txt)"
          printf 'PYTEST_SUMMARY=%s\n' "$summary" >> "$GITHUB_ENV"

      - name: Run Ruff when available
        shell: bash
        run: |
          if python -c 'import ruff' 2>/dev/null; then
            python -m ruff check lighthouse_cli tests scripts
          else
            echo "ruff is not installed by the project extras; skipped"
          fi

      - name: Commit and push only tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/pr12_followups.py \
            .github/workflows/pr12-followups.yml \
            .github/workflows/pr12-followups-retry.yml \
            .github/workflows/pr12-followups-finalize.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix(auth): harden MFA approval and SSO follow-ups"
            git push origin HEAD:arch/deepening-pass
          fi
          printf 'TESTED_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report verified result on PR 12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 12 --repo rabesss/lighthouse-cli --body "PR 12 follow-up automation completed successfully at \`${TESTED_SHA}\`.

          Validation performed on a clean GitHub runner:
          - \`git diff --check\`
          - \`python -m compileall -q lighthouse_cli tests\`
          - editable install of \`.[auth,credentials,dev]\`
          - \`python -m pip check\`
          - full suite: **${PYTEST_SUMMARY}**
          - Ruff when available in the declared extras

          No live credentials or real-account MFA challenges were used by this run. Remaining acceptance work is the real-password method matrix described in the PR handoff."
